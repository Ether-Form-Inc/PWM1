image: ubuntu:24.04

stages:
  - build
  - test

variables:
  BUILD_DIR: build
  CC: clang
  CXX: clang++

before_script:
  - apt-get update
  - apt-get install -y cmake ninja-build clang git python3-venv

build:
  stage: build
  script:
    - cmake -S . -B $BUILD_DIR -G Ninja -DCMAKE_BUILD_TYPE=Debug
    - cmake --build $BUILD_DIR
  artifacts:
    paths:
      - $BUILD_DIR

test:
  stage: test
  dependencies:
    - build
  script:
    - cd $BUILD_DIR
    - ./tests/can_to_pwm_firmware_tests
    